name: Bug Report
description: Report a reproducible bug in the GPX web app.
labels: [bug]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe clearly what you did and what happened instead.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps to reproduce the issue.
      placeholder: |
        1. Open the app (local or GitHub Pages)
        2. Type in the search field / load GPX list
        3. Observe the issue
    validations:
      required: true

  - type: input
    id: app-url
    attributes:
      label: App URL
      description: Link to where the issue is visible (GitHub Pages URL or local URL).
      placeholder: https://gpx.oczadly.io or http://localhost:8080
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide environment details relevant to browser behavior.
      placeholder: |
        - OS: [e.g., macOS 14.5, Windows 11, Ubuntu 24.04]
        - Browser: [e.g., Chrome 136, Firefox 127, Safari 17]
        - Context: [GitHub Pages / Local server]
    validations:
      required: true

  - type: textarea
    id: gpx-samples
    attributes:
      label: Related GPX filenames (if applicable)
      description: If this issue depends on file naming or parsing, add sample filenames.
      placeholder: |
        2026-05-28-beskid-wyspowy.gpx
        2026-05-29-tatry-zachodnie.gpx
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, logs, screenshots, or stack traces about the problem here.
      placeholder: Screenshots, logs, stack traces...
    validations:
      required: false
