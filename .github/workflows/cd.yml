name: CD

on:
  push:
    branches: [ main ]
    paths:
      - index.html
      - app.js
      - share-utils.js
      - gpx-utils.js
      - styles.css
      - scripts/write-tracks-json.mjs
      - favicon.svg
      - social-preview.png
      - gpx/**/*.gpx
      - CNAME
      - .github/workflows/cd.yml
  create:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare deploy directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html app.js share-utils.js gpx-utils.js styles.css favicon.svg .deploy/
          node scripts/write-tracks-json.mjs --input-dir gpx --output-file .deploy/tracks.json
          if [[ -f social-preview.png ]]; then
            cp social-preview.png .deploy/
          fi
          cp -r gpx .deploy/

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "$tag" ]]; then
              tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | sort -V | tail -n 1 || true)"
            fi
          fi

          if [[ -n "$tag" ]]; then
            printf '{"tag":"%s"}\n' "$tag" > .deploy/version.json
          else
            printf '{"tag":null}\n' > .deploy/version.json
          fi

          if [[ -f CNAME ]]; then
            cp CNAME .deploy/
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.deploy
          publish_branch: gh-pages
