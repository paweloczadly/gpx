name: CD

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*-rc.*"
    paths:
      - index.html
      - app.js
      - gpx-utils.js
      - styles.css
      - gpx/**/*.gpx
      - CNAME
      - .github/workflows/cd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare deploy directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp index.html app.js gpx-utils.js styles.css .deploy/
          find gpx -maxdepth 1 -type f -name '*.gpx' -exec cp {} .deploy/ \;

          tag="$(git tag --points-at HEAD | head -n 1 || true)"
          if [[ -n "$tag" ]]; then
            printf '{"tag":"%s"}\n' "$tag" > .deploy/version.json
          else
            printf '{"tag":null}\n' > .deploy/version.json
          fi

          if [[ -f CNAME ]]; then
            cp CNAME .deploy/
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.deploy
          publish_branch: gh-pages
